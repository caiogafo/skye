# Nimbus Router Configuration Example
# =====================================
# This file demonstrates comprehensive router configuration using YAML.
# It showcases multiple routing strategies, environment variable substitution,
# fallback chains, retry policies, and multi-provider setups.

# ROUTES CONFIGURATION
# ====================
# Define routes with aliases and targets. Each route can have multiple targets
# for load balancing and failover. The router will select targets based on the
# configured strategy.

routes:
  # -------------------------------------------------------------------------
  # EXAMPLE 1: Rate-Limit-Aware Strategy
  # -------------------------------------------------------------------------
  # Routes to the target with the most available capacity (TPM/RPM).
  # Best for: High-throughput scenarios, avoiding rate limit errors
  
  - alias: "gpt-3.5-turbo"
    targets:
      # Primary OpenAI target
      - model: "gpt-3.5-turbo"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"  # Environment variable substitution
        tpm: 200000  # Tokens per minute limit
        rpm: 2000    # Requests per minute limit
        tags: ["fast", "cost-effective"]
        metadata:
          deployment: "primary"
          region: "us-east-1"
      
      # Secondary OpenAI target for load balancing
      - model: "gpt-3.5-turbo"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 200000
        rpm: 2000
        tags: ["fast", "cost-effective"]
        metadata:
          deployment: "secondary"
          region: "us-west-2"
    
    strategy: "rate_limit_aware"  # Route to target with most available capacity
    fallback_on_error: true

  # -------------------------------------------------------------------------
  # EXAMPLE 2: Round-Robin Strategy
  # -------------------------------------------------------------------------
  # Distributes requests evenly across all targets in rotation.
  # Best for: Simple load distribution, homogeneous deployments
  
  - alias: "gpt-4"
    targets:
      - model: "gpt-4"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 100000
        rpm: 1000
        tags: ["premium", "high-quality"]
        cost_per_1k_prompt_tokens: 0.03
        cost_per_1k_completion_tokens: 0.06
    
    strategy: "round_robin"

  # -------------------------------------------------------------------------
  # EXAMPLE 3: Least-Busy Strategy
  # -------------------------------------------------------------------------
  # Routes to the target with the fewest active requests.
  # Best for: Real-time load balancing, varying request durations
  
  - alias: "claude"
    targets:
      - model: "claude-3-sonnet-20240229"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
        tpm: 80000
        rpm: 800
        tags: ["anthropic", "claude"]
      
      - model: "claude-3-sonnet-20240229"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY_SECONDARY}"
        tpm: 80000
        rpm: 800
        tags: ["anthropic", "claude"]
    
    strategy: "least_busy"

  # -------------------------------------------------------------------------
  # EXAMPLE 4: Latency-Based Strategy
  # -------------------------------------------------------------------------
  # Routes to the target with the lowest average latency.
  # Best for: Latency-sensitive applications, multi-region deployments
  
  - alias: "azure-gpt4"
    targets:
      # East US deployment
      - model: "gpt-4"
        provider: "azure"
        api_key: "${AZURE_OPENAI_API_KEY_EAST}"
        api_base: "${AZURE_API_BASE_EAST}"
        api_version: "2024-02-15-preview"
        region: "eastus"
        tpm: 100000
        rpm: 1000
        metadata:
          location: "Virginia"
          priority: "primary"
      
      # West US deployment
      - model: "gpt-4"
        provider: "azure"
        api_key: "${AZURE_OPENAI_API_KEY_WEST}"
        api_base: "${AZURE_API_BASE_WEST}"
        api_version: "2024-02-15-preview"
        region: "westus"
        tpm: 100000
        rpm: 1000
        metadata:
          location: "Oregon"
          priority: "secondary"
    
    strategy: "latency_based"

  # -------------------------------------------------------------------------
  # EXAMPLE 5: Cost-Based Strategy
  # -------------------------------------------------------------------------
  # Routes to the target with the lowest cost per token.
  # Best for: Budget-conscious deployments, cost optimization
  
  - alias: "budget"
    targets:
      # Cheaper model option
      - model: "gpt-3.5-turbo"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 200000
        rpm: 2000
        cost_per_1k_prompt_tokens: 0.0005
        cost_per_1k_completion_tokens: 0.0015
        tags: ["budget", "fast"]
      
      # Alternative budget option
      - model: "gpt-3.5-turbo-16k"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 180000
        rpm: 1800
        cost_per_1k_prompt_tokens: 0.001
        cost_per_1k_completion_tokens: 0.002
        tags: ["budget", "large-context"]
    
    strategy: "cost_based"

  # -------------------------------------------------------------------------
  # EXAMPLE 6: Weighted Strategy
  # -------------------------------------------------------------------------
  # Routes based on assigned weights (higher weight = more traffic).
  # Best for: Gradual rollouts, A/B testing, canary deployments
  
  - alias: "weighted-gpt4"
    targets:
      # Primary deployment gets 80% of traffic
      - model: "gpt-4"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 100000
        rpm: 1000
        weight: 80
        metadata:
          deployment: "stable"
      
      # Canary deployment gets 20% of traffic
      - model: "gpt-4-turbo-preview"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 50000
        rpm: 500
        weight: 20
        metadata:
          deployment: "canary"
    
    strategy: "weighted"

  # -------------------------------------------------------------------------
  # EXAMPLE 7: Priority-Based Strategy
  # -------------------------------------------------------------------------
  # Routes to highest priority target first, falls back on failure.
  # Best for: Primary/secondary deployments, disaster recovery
  
  - alias: "priority-claude"
    targets:
      # Primary target (highest priority)
      - model: "claude-3-opus-20240229"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
        priority: 100
        tpm: 80000
        rpm: 800
        metadata:
          tier: "primary"
      
      # Secondary target (medium priority)
      - model: "claude-3-sonnet-20240229"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
        priority: 50
        tpm: 80000
        rpm: 800
        metadata:
          tier: "secondary"
      
      # Tertiary target (lowest priority)
      - model: "claude-3-haiku-20240307"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
        priority: 10
        tpm: 100000
        rpm: 1000
        metadata:
          tier: "tertiary"
    
    strategy: "priority_based"

  # -------------------------------------------------------------------------
  # EXAMPLE 8: Multi-Region AWS Bedrock
  # -------------------------------------------------------------------------
  # AWS Bedrock deployment across multiple regions for redundancy.
  # Uses AWS credentials from environment (AWS_PROFILE or AWS_ACCESS_KEY_ID)
  
  - alias: "bedrock-claude"
    targets:
      # US East region
      - model: "anthropic.claude-3-sonnet-20240229-v1:0"
        provider: "bedrock"
        region: "us-east-1"
        metadata:
          location: "Virginia"
      
      # US West region
      - model: "anthropic.claude-3-sonnet-20240229-v1:0"
        provider: "bedrock"
        region: "us-west-2"
        metadata:
          location: "Oregon"
      
      # EU region
      - model: "anthropic.claude-3-sonnet-20240229-v1:0"
        provider: "bedrock"
        region: "eu-west-1"
        metadata:
          location: "Ireland"
    
    strategy: "latency_based"

  # -------------------------------------------------------------------------
  # EXAMPLE 9: Simple Shuffle Strategy
  # -------------------------------------------------------------------------
  # Random selection from available targets.
  # Best for: Testing, development, unpredictable distribution
  
  - alias: "random"
    targets:
      - model: "gpt-3.5-turbo"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
      
      - model: "claude-3-haiku-20240307"
        provider: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
    
    strategy: "simple_shuffle"


# FALLBACK CHAINS
# ===============
# Define fallback chains for automatic failover when primary models fail.
# The router will try fallback models in order until one succeeds.

fallbacks:
  # If gpt-4 fails, try azure-gpt4, then claude
  - primary: "gpt-4"
    fallbacks: ["azure-gpt4", "claude"]
  
  # If claude fails, try bedrock-claude, then gpt-4
  - primary: "claude"
    fallbacks: ["bedrock-claude", "gpt-4"]
  
  # If azure-gpt4 fails, try gpt-4, then gpt-3.5-turbo
  - primary: "azure-gpt4"
    fallbacks: ["gpt-4", "gpt-3.5-turbo"]
  
  # Budget fallback chain
  - primary: "budget"
    fallbacks: ["gpt-3.5-turbo"]


# RETRY POLICIES
# ==============
# Configure retry behavior per error type. The router will automatically
# retry failed requests based on these policies.

retry_policies:
  # Retry rate limit errors up to 3 times
  - error_type: "RateLimitError"
    max_retries: 3
    retry_after_seconds: 5
    exponential_backoff: true
  
  # Retry timeout errors up to 2 times
  - error_type: "TimeoutError"
    max_retries: 2
    retry_after_seconds: 3
    exponential_backoff: true
  
  # Retry server errors up to 2 times
  - error_type: "ServerError"
    max_retries: 2
    retry_after_seconds: 5
    exponential_backoff: true
  
  # Don't retry authentication errors
  - error_type: "AuthenticationError"
    max_retries: 0


# COOLDOWN POLICIES
# =================
# Configure how many failures are allowed before a model is temporarily
# disabled (put in cooldown). This prevents cascading failures.

allowed_fails_policies:
  # Allow 100 rate limit errors per minute before cooldown
  - error_type: "RateLimitError"
    allowed_fails_per_minute: 100
  
  # Allow 50 timeout errors per minute before cooldown
  - error_type: "TimeoutError"
    allowed_fails_per_minute: 50
  
  # Allow 20 server errors per minute before cooldown
  - error_type: "ServerError"
    allowed_fails_per_minute: 20


# GLOBAL ROUTER SETTINGS
# =======================
# These settings apply to the entire router unless overridden per route.

# Default routing strategy for routes without explicit strategy
strategy: "rate_limit_aware"

# How long (in seconds) to keep failed models in cooldown
cooldown_seconds: 60.0

# Whether to check rate limits before making API calls
# Recommended: true (prevents rate limit errors)
enable_pre_call_checks: true


# ENVIRONMENT VARIABLES REFERENCE
# ================================
# This configuration expects the following environment variables to be set:
#
# OpenAI:
#   OPENAI_API_KEY - Your OpenAI API key
#
# Anthropic:
#   ANTHROPIC_API_KEY - Your Anthropic API key
#   ANTHROPIC_API_KEY_SECONDARY - Secondary Anthropic API key (optional)
#
# Azure OpenAI:
#   AZURE_OPENAI_API_KEY_EAST - Azure OpenAI key for East US
#   AZURE_OPENAI_API_KEY_WEST - Azure OpenAI key for West US
#   AZURE_API_BASE_EAST - Azure OpenAI endpoint for East US
#   AZURE_API_BASE_WEST - Azure OpenAI endpoint for West US
#
# AWS Bedrock:
#   AWS_PROFILE - AWS profile name (or use AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY)
#   AWS_ACCESS_KEY_ID - AWS access key (if not using profile)
#   AWS_SECRET_ACCESS_KEY - AWS secret key (if not using profile)
#
# To set environment variables:
#   export OPENAI_API_KEY="sk-..."
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# For production, use a secret management system:
#   - AWS Secrets Manager
#   - Azure Key Vault
#   - HashiCorp Vault
#   - Kubernetes Secrets


# USAGE EXAMPLE
# =============
# Load this configuration in your Python code:
#
#   from nimbus.routes import ModelRouter
#   
#   router = ModelRouter.from_yaml("router_config.yaml")
#   
#   response = router.route_request(
#       messages=[UserMessage(content="Hello!")],
#       model="gpt-3.5-turbo"  # Use alias from this config
#   )
#
# See examples/routing/yaml_config.py for more examples.
