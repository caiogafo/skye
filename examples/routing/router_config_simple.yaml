# Simple Nimbus Router Configuration
# ===================================
# This is a simplified configuration for demonstration purposes.
# It only requires OPENAI_API_KEY to be set.

routes:
  # Basic GPT-3.5 Turbo route with rate limiting
  - alias: "gpt-3.5-turbo"
    targets:
      - model: "gpt-3.5-turbo"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 200000
        rpm: 2000
        tags: ["fast", "cost-effective"]
    strategy: "rate_limit_aware"

  # GPT-4 route with round-robin
  - alias: "gpt-4"
    targets:
      - model: "gpt-4"
        provider: "openai"
        api_key: "${OPENAI_API_KEY}"
        tpm: 100000
        rpm: 1000
        tags: ["premium", "high-quality"]
    strategy: "round_robin"

# Fallback chain
fallbacks:
  - primary: "gpt-4"
    fallbacks: ["gpt-3.5-turbo"]

# Retry policies
retry_policies:
  - error_type: "RateLimitError"
    max_retries: 3

# Cooldown policies
allowed_fails_policies:
  - error_type: "RateLimitError"
    allowed_fails_per_minute: 100

# Global settings
strategy: "rate_limit_aware"
cooldown_seconds: 60.0
enable_pre_call_checks: true
