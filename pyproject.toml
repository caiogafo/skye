[project]
name = "nimbus"
version = "0.1.0"
description = "Modular GenAI library with optional extras for building AI agents and intelligent applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nimbus Team"}]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
# Individual providers
openai = ["openai>=1.0", "tiktoken>=0.5"]
anthropic = ["anthropic>=0.25"]
bedrock = ["boto3>=1.28"]  # Optional in Lambda environments
azure = ["azure-ai-inference>=1.0.0b1", "azure-identity>=1.15"]
vertex = ["google-cloud-aiplatform>=1.38"]
cohere = ["cohere>=5.0"]

# Individual components
agents = []
prompts = ["jinja2>=3.0"]
tools = ["requests>=2.31", "httpx>=0.24"]
memory = ["redis>=5.0", "psycopg2-binary>=2.9"]
guard = []
observe = ["opentelemetry-api>=1.20", "prometheus-client>=0.19"]

# Convenience bundles
llm-providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "tiktoken>=0.5"]
embedding-providers = ["openai>=1.0", "cohere>=5.0", "tiktoken>=0.5"]
all-providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "azure-ai-inference>=1.0.0b1", "azure-identity>=1.15", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5"]
providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "azure-ai-inference>=1.0.0b1", "azure-identity>=1.15", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5"]
all = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "azure-ai-inference>=1.0.0b1", "azure-identity>=1.15", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5", "redis>=5.0", "psycopg2-binary>=2.9", "opentelemetry-api>=1.20", "prometheus-client>=0.19"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "responses>=0.23",
    "requests>=2.31",
    "httpx>=0.24",
    "tomli>=2.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "stress: marks tests as stress tests (deselect with '-m \"not stress\"')",
    "budget: installs Nimbus in clean environments to check size budgets (needs uv and network; run with '-m budget')",
]
addopts = "-m 'not budget'"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
