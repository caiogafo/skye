[project]
name = "skyeai"
version = "0.1.1"
description = "Modular GenAI library with optional extras for building AI agents and intelligent applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gianluigi Mucciolo"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ggiallo28/skye"
Documentation = "https://skye.readthedocs.io"
Repository = "https://github.com/ggiallo28/skye"
Issues = "https://github.com/ggiallo28/skye/issues"

[project.scripts]
skye = "skye.utils.cli:main"

[project.optional-dependencies]
openai = []
anthropic = []
bedrock = []
google = []
cohere = []
tokens = ["tiktoken>=0.5"]
auth = ["rsa>=4.9"]
agents = []
prompts = []
tools = []
mcp = ["fastmcp-slim[client]>=4.0"]
memory = []
redis = ["redis>=5.0"]
valkey = ["valkey>=6.0"]
postgres = ["pg8000>=1.30"]
postgres-asyncpg = ["asyncpg>=0.29"]
aws = ["boto3>=1.28"]
guard = []
teams = []
flows = []
observe = []
llm-providers = ["tiktoken>=0.5"]
embedding-providers = ["tiktoken>=0.5"]
all-providers = ["tiktoken>=0.5"]
providers = ["tiktoken>=0.5"]
all = ["tiktoken>=0.5", "redis>=5.0", "valkey>=6.0", "pg8000>=1.30", "asyncpg>=0.29", "fastmcp-slim[client]>=4.0", "rsa>=4.9"]

[dependency-groups]
dev = [
    "pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1", "mypy>=1.0",
    "types-requests>=2.31", "responses>=0.23", "requests>=2.31", "httpx>=0.24",
    "openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "google-cloud-aiplatform>=1.38", "fastmcp>=2.0",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-git-revision-date-localized-plugin>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["stress: marks stress tests", "differential: marks differential tests", "budget: marks budget tests"]
addopts = "-m 'not budget'"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.", "if TYPE_CHECKING:", "@abstractmethod"]

[tool.hatch.build.targets.wheel]
packages = ["src/skye"]
