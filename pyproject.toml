[project]
name = "skyeai"
version = "0.1.1"
description = "Modular GenAI library with optional extras for building AI agents and intelligent applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Gianluigi Mucciolo"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the core is the standard library only (decision D49; supersedes the pydantic and tenacity entries)


[project.urls]
Homepage = "https://github.com/ggiallo28/skye"
Documentation = "https://skye.readthedocs.io"
Repository = "https://github.com/ggiallo28/skye"
Issues = "https://github.com/ggiallo28/skye/issues"


[project.scripts]
skye = "skye.utils.cli:main"


[project.optional-dependencies]
# Model providers: each has one built-in stdlib REST adapter (Requirement 20); vendor SDKs are
# dev/test oracles only. The extras exist so `pip install skyeai[openai]` etc. keep working.
openai = []
anthropic = []
bedrock = []  # SigV4 is in the stdlib (auth/sigv4.py); boto3 is not needed
google = []
cohere = []


# Exact token counts for gpt-*/o1/o3 models (decision D33); the library falls back to a stdlib estimate when tiktoken is absent.
tokens = ["tiktoken>=0.5"]


# Individual components
# auth: pure-Python RSA for RS256 (Google service-account JWT, Azure certificate assertion).
auth = ["rsa>=4.9"]
agents = []
prompts = []  # empty extra: the template engine is standard library
tools = []  # empty extra: a module of the core, no third-party libraries
# mcp: fastmcp, the optional full-capability substitute for the built-in stdlib MCP client,
# chosen only by create_mcp_client(target, impl="fastmcp") (Requirement 21).
mcp = ["fastmcp-slim[client]>=4.0"]  # client only: full fastmcp also pulls the server stack (pyyaml, watchfiles, websockets, jsonref)
# memory: no store driver of its own; install the extra of the backend you store in (decision D99).
memory = []
# Store backends: one extra per backend, never per component (decisions D96, D99, D100). In-memory, file and the
# durable function need none; the RDS Data API driver of PostgreSQL needs only boto3.
redis = ["redis>=5.0"]
valkey = ["valkey>=6.0"]  # valkey-py, same API as redis-py; preferred by RedisBackend when installed (D102)
postgres = ["pg8000>=1.30"]  # pure Python, any PostgreSQL
postgres-asyncpg = ["asyncpg>=0.29"]  # compiled, the fastest PostgreSQL driver
aws = ["boto3>=1.28"]  # DynamoDB and the RDS Data API outside AWS Lambda (preinstalled in Lambda)
guard = []
