[project]
name = "nimbus"
version = "0.1.0"
description = "Modular GenAI library with optional extras for building AI agents and intelligent applications"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nimbus Team"}]
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
# Individual providers
openai = ["openai>=1.0", "tiktoken>=0.5"]
anthropic = ["anthropic>=0.25"]
bedrock = ["boto3>=1.28"]  # Optional in Lambda environments
google = ["google-cloud-aiplatform>=1.38"]
cohere = ["cohere>=5.0"]

# Individual components
# auth: pure-Python RSA for RS256 (Google service-account JWT, Azure certificate assertion).
auth = ["rsa>=4.9"]
agents = []
prompts = ["jinja2>=3.0"]
tools = []  # empty extra: a module of the core, no third-party libraries
# mcp: fastmcp, the optional full-capability substitute for the built-in stdlib MCP client,
# chosen only by create_mcp_client(target, impl="fastmcp") (Req 25).
mcp = ["fastmcp>=2.0"]
memory = ["redis>=5.0", "asyncpg>=0.29"]
guard = []
teams = []  # empty extra: a module of the core, no third-party libraries
flows = []  # empty extra: a module of the core, no third-party libraries
observe = []  # nothing imports a telemetry library yet; declare it with the code that does (task 8.1)

# Convenience bundles
llm-providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "tiktoken>=0.5"]
embedding-providers = ["openai>=1.0", "cohere>=5.0", "tiktoken>=0.5"]
all-providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5"]
providers = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5"]
all = ["openai>=1.0", "anthropic>=0.25", "boto3>=1.28", "google-cloud-aiplatform>=1.38", "cohere>=5.0", "tiktoken>=0.5", "redis>=5.0", "asyncpg>=0.29", "fastmcp>=2.0", "rsa>=4.9"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "types-requests>=2.31",
    "responses>=0.23",
    "requests>=2.31",
    "httpx>=0.24",
    "tomli>=2.0; python_version < '3.11'",
    # Official vendor SDKs + fastmcp: differential-test validation oracles only (Req 18.1).
    # This dev group is the single validation home: never a runtime dependency, and never
    # declared as an extra *for the validation purpose*. (The same SDKs appear above under
    # [project.optional-dependencies] as user opt-in backend extras per Req 17 — that is a
    # separate, allowed concern: a user choosing nimbus[openai] etc. at runtime, not validation.)
    "openai>=1.0",
    "anthropic>=0.25",
    "boto3>=1.28",
    "google-cloud-aiplatform>=1.38",
    "fastmcp>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "stress: marks tests as stress tests (deselect with '-m \"not stress\"')",
    "differential: built-in vs official-SDK equivalence tests (dev env only; run with 'make differential')",
    "budget: installs Nimbus in clean environments to check size budgets (needs uv and network; run with '-m budget')",
]
addopts = "-m 'not budget'"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
